    permission: deny
  configs:
    ls:
      enabled: true
      permission: allow
    apps:
      enabled: true
      permission: deny
      config:
        allowed_apps: []
    bash:
      enabled: true
      permission: allow
    find:
      enabled: true
      permission: allow
    read:
      enabled: true
      permission: allow
    show:
      enabled: true
      permission: allow
    write:
      enabled: true
      permission: allow
    fetch_file:
      enabled: true
      permission: allow
    board_read:
      enabled: true
      permission: allow
    board_write:
      enabled: true
      permission: allow
    find_files:
      enabled: true
      permission: allow
    read_skill:
      enabled: true
      permission: allow
    list_agents:
      enabled: true
      permission: allow
    ask_operator:
      enabled: true
      permission: allow
    publish_file:
      enabled: true
      permission: allow
    send_to_agent:
