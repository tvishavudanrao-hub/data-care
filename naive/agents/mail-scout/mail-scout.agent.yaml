    agentmail.agent_attach_human: {enabled: false, permission: deny}
    # Off: Naive's own mail and CRM tools (people's data), and every other built-in tool.
    email.inboxes: {enabled: false, permission: deny}
    email.read: {enabled: false, permission: deny}
    email.send: {enabled: false, permission: deny}
    crm.read: {enabled: false, permission: deny}
    crm.write: {enabled: false, permission: deny}
    bash: {enabled: false, permission: deny}
    edit: {enabled: false, permission: deny}
    find: {enabled: false, permission: deny}
    fetch_file: {enabled: false, permission: deny}
